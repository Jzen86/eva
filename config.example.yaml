# Eva — пример конфига.
# Скопируй в ~/.eva/config.yaml (путь переопределяется EVA_CONFIG_PATH) и заполни ключи.
# Этот файл в репозитории — только образец. Реальные ключи никогда не коммитятся.

agent:
  name: Ева
  gender: neutral                      # female|male|neutral — по умолчанию neutral: пол не выбирается за владельца
  # Сколько тишины считать паузой. Ниже порога разрыва для неё не существует:
  # она отвечает как на продолжение той же сцены. Выше — она видит, сколько
  # прошло и что за это время могло случиться (сменились сутки, попала ночь),
  # и спрашивает, чем ты жил, вместо «как успехи с сейфами» через сутки.
  # 10 минут намеренно не считаются паузой: «скучала» — это её тон, а не замер.
  gap_threshold_min: 30
  personality:
    # Либо слайдеры 0-4, либо поля ниже — работает и то, и другое.
    # Персона здесь намеренно не зашита: в репозитории лежит база, а не
    # чья-то Ева. `eva init` ничего про неё не спрашивает — ставит машину.
    # Пол, фото, характер и правило общения владелец отдаёт в чате,
    # командой /persona: четыре вопроса, каждый можно пропустить, всё
    # сохраняется сразу и меняется в любой момент. Скажи ей в чате словами —
    # запишет сама (попадёт в agent.personality.persona).
    # ops — постоянные правила, список строк: то, что должно выполняться
    # всегда, в отличие от характера, который читается как настроение.
    formality: 1
    emotionality: 3
    humor: 2
    confidence: 3
    response_length: 2
    emoji: 2
    initiative: 3
    curiosity: 3
    empathy: 3
    criticism: 1
    # tone: friendly
    # style: detailed
    # persona: |
    #   ...
    # ops:
    #   - "Не выдумывай то, чего не знаешь."

owner:
  name: ""                            # как тебя зовут — она подхватит, если оставишь пустым
  address_as: ""                      # как тебя называть: по имени, по нику, шеф
  facts: []                           # о тебе: что любишь, чем занят, как спать

security:
  password_hash: ""                   # заполняется сам при первом запуске

# Инструменты, которые не включены по умолчанию. Каждый — отдельный уровень
# доверия, и выдавать его молча нельзя.
tools:
  browser: false                      # тянет ~150 МБ Chromium и лезет на любые страницы
  ssh: false                          # исполняет команды на другом хосте
  npm_install: false                  # запускает install-скрипты чужих пакетов
  # files_roots: []                   # где `files` вправе писать и откуда
  #                                  # `send_file` шлёт файлы; по умолчанию —
  #                                  # каталог конфига и temp (секреты и БД
  #                                  # закрыты при любом раскладе)
  # shell_trust: []                   # бинарники, которые Ева вправе запускать
  #                                  # целиком, вместе с пишущими режимами (git
  #                                  # здесь означает, что git push идёт без
  #                                  # подтверждения — это решение о доверии)

# ─────────────────────────────────────────────────────────────────────────────
# Провайдеры и модели
# ─────────────────────────────────────────────────────────────────────────────
# Провайдер — это адрес + ключ. Всё, что говорит на OpenAI-совместимом API,
# подходит: OpenRouter, OpenAI, Google (Gemini), Groq, DeepSeek, Together,
# Cerebras, LM Studio, vLLM, llama.cpp — что угодно.
#
# Имя провайдера, которого нет в списке готовых, тоже можно: укажи base_url
# и api_key явно, и он заработает так же.
#
# Готовые имена, base_url и заголовки подставляются автоматически:
#   openrouter   https://openrouter.ai/api/v1
#   openai       https://api.openai.com/v1
#   google       https://generativelanguage.googleapis.com/v1beta/openai
#   groq         https://api.groq.com/openai/v1
#   deepseek     https://api.deepseek.com/v1
#   together     https://api.together.xyz/v1
#   cerebras     https://api.cerebras.ai/v1

providers:
  openrouter:
    api_key: YOUR_OPENROUTER_KEY       # base_url и заголовки — из готового шаблона
  # Одновременно можно держать сколько угодно провайдеров и переключаться между
  # ними на лету. Например, запасной на случай, если у первого кончились деньги:
  #
  # google:
  #   api_key: YOUR_GEMINI_KEY
  # groq:
  #   api_key: YOUR_GROQ_KEY
  # ollama:                             # любой свой эндпоинт
  #   base_url: http://127.0.0.1:11434/v1
  #   api_key: ollama                    # ollama требует заголовок, но ключ не проверяет

# Роли: какая модель за что отвечает.
#   fast   — болтовня, быстрые ответы
#   strong — тяжёлые инструменты: shell, browser, установка пакетов, правка
#            себя, диагностика (лёгкие тулзы — поиск, память, медиа — остаются
#            на fast, см. src/core/tool-tiers.ts)
#   study  — фоновое самообучение (необязательно, иначе берётся fast)
#   checks — плановые проверки: обход сервера и разбор своего лога
#            (необязательно, иначе идут на strong, как обычный тулзовый ход).
#            Смысл роли — не поднимать проверку на strong: она с первого хода
#            зовёт shell, то есть потяжелела бы вся, а работа у неё узкая —
#            прочитать лог, прочитать diff, написать отчёт
#   compaction — тот, кто сворачивает старые сообщения в саммари (дайджест памяти)
#            и склеивает куски дайджеста, когда он распух. Необязательно: без
#            неё этим занимается fast, как и раньше. Роль существует потому, что
#            это работа, а не разговор: в дайджест попадает всё, что выпало из
#            окна, — включая то, что фильтр провайдера читать отказывается, — и
#            когда сворачивал чат-модель, её отказ ещё и сажал живой ответ на
#            фолбэк. Своя модель (подешевле, без фильтра) оставляет чат чату
#   embed  — эмбеддинги для поиска по навыкам (необязательно)
#   image  — генерация картинок (необязательно)
models:
  fast:
    provider: openrouter
    model: google/gemini-2.5-flash
  strong:
    provider: openrouter
    model: anthropic/claude-sonnet-4
  # study:
  #   provider: openrouter
  #   model: qwen/qwen3.7-flash
  # checks:
  #   provider: openrouter
  #   model: anthropic/claude-haiku-5.5
  # compaction:
  #   provider: openrouter
  #   model: qwen/qwen3.7-flash
  # embed:
  #   provider: google
  #   model: text-embedding-004

# Запасные модели: перебираются по порядку, если основная не ответила.
# Транзиентные ошибки (5xx, сеть, таймаут, 429) и кончившиеся деньги (402)
# переключают на следующую. Ошибка запроса (400) — нет: повтор не поможет.
fallbacks:
  - provider: openrouter
    model: qwen/qwen3-coder:free
  - provider: openrouter
    model: deepseek/deepseek-chat-v3-0324:free

telegram:
  token: YOUR_TELEGRAM_BOT_TOKEN
  streaming: true
  owner_id: 123456789                  # твой numeric Telegram ID

memory:
  max_knowledge: 200
  study_interval_min: 60
  learning_enabled: true

# Секции ниже опциональны, включать только если нужно.
# Голос (Gemini TTS). Лимит — на модель в сутки (у flash-lite tts обычно 10),
# поэтому перечисляем несколько моделей и/или ключей: когда у одной кончился
# лимит, голос берёт следующую, а не выключается до завтра.
# voice:
#   tts_provider: gemini
#   voice_id: Aoede
#   gemini_model: gemini-3.8-flash-lite-tts      # основная (одна, как раньше)
#   gemini_models:                               # необязательно: цепочка моделей
#     - gemini-3.8-flash-lite-tts
#     - gemini-2.5-flash-preview-tts
#   gemini_api_key: YOUR_GEMINI_KEY
#   gemini_api_keys:                             # необязательно: второй ключ = ещё лимит
#     - YOUR_GEMINI_KEY
#   stt_models:                                  # распознавание её голосовых на вход (тот же ключ)
#     - gemini-3.5-flash-lite
#     - gemini-3.5-flash
# selfies:    { provider: "openrouter", openrouter_model: "recraft/recraft-v4.1-flash", reference_photo_url: "https://..." }
# google:     { api_key: "...", cx: "..." }
# plugins:    ["voice", "selfies"]

# Генерация картинок. Внимание: режим modalities:["image"] — это расширение
# OpenRouter, не часть спецификации OpenAI. Другой эндпоинт сработает, только
# если он тоже это умеет. Если секции нет — берётся провайдер роли image,
# затем fast.
# image_gen:
#   base_url: https://openrouter.ai/api/v1
#   api_key: YOUR_KEY
#   model: google/gemini-2.5-flash-image
#
# Локальный ComfyUI — идёт ПЕРВЫМ у обоих тулзов (селфи и картинки), облако выше — фолбэк.
# URL смотрит на ComfyUI; обычно он крутится на ПК владельца (GPU) и виден серверу через
# реверс-туннель. Граф — qwen-image-2.1-turbo (ноды TextEncodeQwenImage21 / QwenImage21Cache).
# Ключей не надо — рисует своя карта; недоступен — тулза тихо уходит в облачный фолбэк.
# comfy:
#   url: http://127.0.0.1:8188
#
# Внешность и фигура (обе — «её», личное, потому в конфиге, а не в репозитории).
# `appearance` — запасное лицо на облачном пути: облачные провайдеры фото реального человека
# рисовать отказываются, поэтому в облако фото не прикладывается, а внешность едет словами.
# У локального ComfyUI наоборот — лицо берётся с фото, и этот текст лишь дополняет его.
# selfies:
#   appearance: "A woman in her late twenties, warm skin, dark eyes, long dark hair"   # ПРИМЕР — впиши своё
#   # `body` — стандарт фигуры для селфи: идёт в каждый селфи-кадр, чтобы тело не менялось кадр от кадра.
#   # Путь «картинок» (image_gen) его не читает — тот рисует что угодно и берёт промпт как есть.
#   # Только пропорции и кожа. Одежду задаёт сцена, и она сильнее: свитер в сцене = она одета.
#   body: "Woman with a balanced figure, a proportionate waist, a flat stomach, beautiful natural hips, smooth realistic skin. Photorealistic, ultra detailed skin texture."
#
# «Инициатива» — она пишет первой, сама, без запроса. Периоды задают ТОЛЬКО время и
# сколько раз за период можно написать; что именно (текст / селфи / голосовое / ничего) и в
# какой сцене — её решение, по времени суток. Потолки и тишину держит код, не она.
# Её локальное время = agent.timezone_offset_hours (сервер считает в UTC).
# initiative:
#   enabled: false          # мастер-выключатель
#   idle_min: 30            # не лезть, если владелец писал последние N минут
#   min_gap_min: 90         # минимум минут между двумя присыланиями (по всем периодам)
#   periods:
#     - { name: "утро",  from: "06:00", to: "10:00", per_day: 1 }
#     - { name: "день",  from: "10:00", to: "20:00", per_day: 4 }
#     - { name: "вечер", from: "20:00", to: "24:00", per_day: 2 }   # 24:00 = конец суток
#     - { name: "ночь",  from: "00:00", to: "06:00", per_day: 1 }
#   # per_day — потолок за период, а не план: она может написать от нуля до этого числа,
#   # текстом, селфи или голосовым. Момент внутри периода — случайная минута, разная по дням.
